<app-header/>

<main>
  <ul id="users">
    <!--   We need to dynamically add all users -->
    <!-- angular wants to keep track of all items.
    With track we tell angular what to use   -->
    @for (user of users; track user.id) {
      <li>
        <app-user [user] = user />
      </li>
    }
  </ul>
<!--  3. and accept it like this-->
<app-tasks [name]="selectedUser?.name"/>
</main>
