<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
    <menu>
      <button>Add Task</button>
    </menu>
  </header>
  <ul>
    @for (task of selectedUserTasks; track task.id) {
      <li>
<!--        2 pass it to our component -->
        <app-task [task]="task"/>
      </li>
    }
  </ul>

</section>
