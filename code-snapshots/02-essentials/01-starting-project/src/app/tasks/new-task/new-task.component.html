<div class="backdrop" (click)="onCancel()"></div>
<dialog open>
  <h2>Add Task</h2>
  <form (ngSubmit)="onSubmit()">
    <p>
      <label for="title">Title</label>
      <!-- 3. set up 2 way binding with a standard directive -->
      <!--      Let you listen to value changes AND
        give ability to write data back into this input-->
      <input
        type="text"
        id="title"
        name="title"
        [(ngModel)]="enteredTitle"
      />
    </p>

    <p>
      <label for="summary">Summary</label>
      <textarea
        id="summary"
        rows="5"
        name="summary"
        [(ngModel)]="enteredSummary"
      ></textarea>
    </p>

    <p>
      <label for="due-date">Due Date</label>
      <!--inputs will always yield a string value, even for dates -->
      <input type="date"
             id="due-date"
             name="due-date"
             [(ngModel)]="enteredDate"
      />
    </p>

    <p class="actions">
      <!-- 6. Also invoke it here    -->
      <button type="button" (click)="onCancel()">Cancel</button>
      <!-- As a html default, clicking a type=submit button      -->
      <!-- Automatically sends a request to the server that serves these files-->
      <!-- This is not what we want. We should prevent this     -->
      <!-- Angular does that automatically for us, when we use the Forms module -->
      <!-- Because it uses a FormsComponent for <forms> -->
      <!-- It also provides a submission event which you can use -->
      <button type="submit">Create</button>
    </p>
  </form>
</dialog>
